## IDF Component Manager Manifest File
##
## Only espressif and lvgl components are used.
##
dependencies:
  idf:
    version: '>=5.5.0'
  
  ## LVGL 8.x graphics library
  lvgl/lvgl:
    version: "8.4.*"

  ## ESP LVGL Port - integrates LVGL with ESP-IDF
  ## Handles LVGL task, display driver, touch input
  espressif/esp_lvgl_port:
    version: "^2"

  ## GT911 capacitive touch controller driver
  espressif/esp_lcd_touch_gt911:
    version: "^1"

  ## EK79007 MIPI DSI LCD panel driver (handles DBI commands + DPI panel)
  espressif/esp_lcd_ek79007:
    version: "^2"

  ## Neural network inference framework
  espressif/esp-dl: 
    version: "^3.2.4"